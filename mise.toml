[tools]
bun = "1.4"
node = "22"
"github:leanprover/elan" = "4.2.4"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.test]
description = "Type-check, then run every suite (the tool's tests and both examples)"
depends = ["lean"]
run = ["bun run typecheck", "bun run test"]

[tasks.model]
description = "Verify the Dafny model and compile it to JavaScript (needs dafny and z3 on PATH)"
dir = "examples/coupon/spec"
run = """
dafny translate js --include-runtime --output model coupon.dfy
mv model.js model.cjs
printf '\\nmodule.exports = { _dafny, CouponModel };\\n' >> model.cjs
rm -f model-js.dtr
"""

[tasks.lean]
description = "Check the Lean proofs and build the Lean oracle (installs elan on first run)"
dir = "examples/coupon/lean"
run = """
[ -x "$HOME/.elan/bin/lake" ] || "$(mise where github:leanprover/elan)/elan-init" -y --no-modify-path --default-toolchain none
"$HOME/.elan/bin/lake" build
"""

[tasks."study:coupon"]
description = "Mutation, semantic mutants and pruning on the coupon example"
depends = ["lean"]
run = """
cd examples/coupon
export LEAN_ORACLE="$PWD/lean/.lake/build/bin/oracle"
stryker run
stryker run stryker.props.json
stryker run stryker.lean.json
cd ../..
for s in "" props lean; do
  bun src/semantic.ts examples/coupon examples/coupon/mutants "vitest${s:+.$s}.config.ts" > "examples/coupon/reports/semantic${s:+-$s}.json"
done
bun experiments/coupon.ts
"""

[tasks."study:redemption"]
description = "Model-check the redemption designs with TLC (needs Java)"
run = "./experiments/redemption.sh"

[tasks."study:generators"]
description = "Oracle vs boundary bug, with biased and uniform input generation"
run = "./experiments/generators.sh"

[tasks.study]
description = "Run the whole study"
depends = ["study:coupon", "study:generators", "study:redemption"]

[tasks.prune]
description = "Show what the pruner says about the example suite (after study:coupon)"
dir = "examples/coupon"
run = "bun ../../src/cli.ts reports/mutation.json --semantic reports/semantic.json"
