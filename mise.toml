[tools]
bun = "1.4"
node = "22"
"github:leanprover/elan" = "4.2.4"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.test]
description = "Type-check, then run every suite (the tool's tests and both examples)"
depends = ["lean"]
run = ["bun run typecheck", "bun run test"]

[tasks.model]
description = "Verify the Dafny model and compile it to JavaScript (needs dafny and z3 on PATH)"
dir = "examples/coupon/spec"
run = """
dafny translate js --include-runtime --output model coupon.dfy
mv model.js model.cjs
printf '\\nmodule.exports = { _dafny, CouponModel };\\n' >> model.cjs
rm -f model-js.dtr
"""

[tasks.lean]
description = "Check the Lean proofs and build the Lean oracle (installs elan on first run)"
dir = "examples/coupon/lean"
run = """
[ -x "$HOME/.elan/bin/lake" ] || "$(mise where github:leanprover/elan)/elan-init" -y --no-modify-path --default-toolchain none
"$HOME/.elan/bin/lake" build
"""

[tasks."study:coupon"]
description = "Mutation, semantic mutants and pruning on the coupon example"
depends = ["lean"]
run = """
cd examples/coupon
export LEAN_ORACLE="$PWD/lean/.lake/build/bin/oracle"
stryker run
stryker run stryker.props.json
stryker run stryker.lean.json
cd ../..
for s in "" props lean; do
  bun src/semantic.ts examples/coupon examples/coupon/mutants "vitest${s:+.$s}.config.ts" > "examples/coupon/reports/semantic${s:+-$s}.json"
done
bun experiments/coupon.ts
"""

[tasks."study:redemption"]
description = "Model-check the redemption designs with TLC (needs Java)"
run = "./experiments/redemption.sh"

[tasks."study:generators"]
description = "Oracle vs boundary bug, with biased and uniform input generation"
run = "./experiments/generators.sh"

[tasks."study:boundaries"]
description = "Which spec boundaries the input generators reach, from the Dafny model alone"
run = "bun experiments/boundaries.ts"

[tasks."study:corpus"]
description = "Real libraries: human vs agent-written suites, Stryker and semantic mutants (runs third-party code offline)"
run = "./experiments/corpus.sh"

[tasks."study:cases"]
description = "Case coverage of the pruned corpus suites, then which lost cases are derivable (slow: ~1 h on 2 cores; after study:corpus)"
run = ["bun experiments/cases.ts", "corpus/offline bun experiments/derivation/scule_relations.ts"]

[tasks."study:derivation"]
description = "Which coupon tests follow from kept tests, proved rules or the model (Z3), and Lean certificates for every value test"
depends = ["lean"]
run = """
${PYTHON:-python3} experiments/derivation/coupon_smt.py
python3 experiments/derivation/lean_cases.py
cd examples/coupon/lean && "$HOME/.elan/bin/lake" env lean Cases.lean
"""

[tasks."study:history"]
description = "Revert real fix commits and run the full and pruned suites against them"
depends = ["study:corpus"]
run = "./experiments/history.sh"

[tasks."study:triangulate"]
description = "Check two independent implementations of the pruning verdict agree on every report"
run = "./triangulation/check.sh"

[tasks.study]
description = "Run the whole study"
depends = ["study:coupon", "study:generators", "study:boundaries", "study:derivation", "study:redemption", "study:corpus", "study:history"]

[tasks.prune]
description = "Show what the pruner says about the example suite (after study:coupon)"
dir = "examples/coupon"
run = "bun ../../src/cli.ts reports/mutation.json --semantic reports/semantic.json"
